[pytest]
asyncio_mode = auto
testpaths = tests

# A Home Assistant custom integration is never pip-installed: it is copied to
# <config>/custom_components/<domain>/. This repository mirrors that path exactly
# so deployment is a straight copy, which means there is no package to install
# and nothing for an editable install to do. The tests therefore need the
# directory that *contains* custom_components/ on sys.path, and that is this
# rootdir. Declaring it here keeps `pytest tests/` working from a clean shell
# without callers having to export PYTHONPATH.
pythonpath = .
