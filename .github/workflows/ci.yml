name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check custom_components tests tools
      - name: pytest
        run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HACS only works with public repositories - that is stated in its own
      # publishing documentation, and the validator behaves accordingly: while this
      # repository is private it cannot read hacs.json or manifest.json and reports
      # both as missing. That is a property of the check, not a defect here.
      #
      # So the job is conditional on visibility rather than disabled. It costs
      # nothing while private and turns itself on the moment the repository is made
      # public, which is better than a comment asking someone to remember.
      - name: HACS validation
        if: ${{ !github.event.repository.private }}
        uses: hacs/action@main
        with:
          category: integration

      - name: Pending while private
        if: ${{ github.event.repository.private }}
        run: |
          echo "::notice title=HACS validation pending::Skipped because this \
          repository is private. HACS supports public repositories only. This job \
          runs for real on the first push after the repository is made public."
